[project]
name = "city-value-housing"
version = "0.1.0"
description = "Swansea vs Cardiff vs Bristol vs Bath house-price value analysis (Price Paid + EPC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "httpx>=0.27",
  "pyyaml>=6",
  "tqdm>=4.66",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
ml = [
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
